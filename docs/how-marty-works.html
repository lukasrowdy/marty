body{font-family:"Segoe UI",Arial,sans-serif;color:#1c2430;margin:0}
h1{font-size:20pt;color:#0f2a4a;margin:0 0 2px;text-align:center}

<h1>How Marty Works</h1>
<div class="sub">A personal AI operator built on Claude Code by Lukas Alvarez</div>
<svg viewBox="0 0 720 560" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5a6675"/></marker></defs>
<rect x="250" y="10" width="220" height="56" rx="10" fill="#0f2a4a"/>
<text x="360" y="34" fill="#fff" text-anchor="middle" font-weight="bold" font-size="14">Lukas</text>
<text x="360" y="53" fill="#cfe0f5" text-anchor="middle">chat · phone dashboard · voice</text>
<line x1="360" y1="66" x2="360" y2="106" stroke="#5a6675" stroke-width="2" marker-end="url(#a)"/>
<rect x="210" y="108" width="300" height="70" rx="10" fill="#2f6db3"/>
<text x="360" y="134" fill="#fff" text-anchor="middle" font-weight="bold" font-size="14">Marty (Claude Code)</text>
<text x="360" y="153" fill="#e3eefb" text-anchor="middle">holds the conversation and the judgment calls,</text>
<text x="360" y="169" fill="#e3eefb" text-anchor="middle">delegates everything else</text>
<rect x="20" y="108" width="160" height="150" rx="10" fill="#eef2f7" stroke="#b9c6d6"/>
<text x="100" y="130" text-anchor="middle" font-weight="bold">Memory</text>
<text x="100" y="150" text-anchor="middle">Obsidian vault</text>
<text x="100" y="170" text-anchor="middle">index → folder index</text>
<text x="100" y="188" text-anchor="middle">→ one master note</text>
<text x="100" y="206" text-anchor="middle">per recurring job</text>
<text x="100" y="230" text-anchor="middle" fill="#5a6675">load one job's worth,</text>
<text x="100" y="246" text-anchor="middle" fill="#5a6675">just in time</text>
<line x1="208" y1="143" x2="182" y2="143" stroke="#5a6675" stroke-width="2" marker-end="url(#a)"/>
<rect x="540" y="108" width="160" height="150" rx="10" fill="#eef2f7" stroke="#b9c6d6"/>
<text x="620" y="130" text-anchor="middle" font-weight="bold">Hands</text>
<text x="620" y="152" text-anchor="middle">email (drafts out)</text>
<text x="620" y="172" text-anchor="middle">files and documents</text>
<text x="620" y="192" text-anchor="middle">calendar</text>
<text x="620" y="212" text-anchor="middle">browser</text>
<text x="620" y="240" text-anchor="middle" fill="#5a6675">finished work, not advice</text>
<line x1="512" y1="143" x2="538" y2="143" stroke="#5a6675" stroke-width="2" marker-end="url(#a)"/>
<line x1="360" y1="178" x2="360" y2="218" stroke="#5a6675" stroke-width="2" marker-end="url(#a)"/>
<rect x="200" y="220" width="320" height="150" rx="10" fill="#fff" stroke="#2f6db3" stroke-width="2"/>
<text x="360" y="242" text-anchor="middle" font-weight="bold" font-size="13">A team that argues (subagents)</text>
<text x="360" y="264" text-anchor="middle">researcher: outside primary sources</text>
<text x="360" y="283" text-anchor="middle">scout: finds things on disk</text>
<text x="360" y="302" text-anchor="middle">log-reader: what actually happened</text>
<text x="360" y="321" text-anchor="middle">cyber-specialist: security review</text>
<text x="360" y="340" text-anchor="middle">vault-keeper: keeps the memory map true</text>
<text x="360" y="360" text-anchor="middle" font-weight="bold" fill="#b33">skeptic: tries to break every claim first</text>
<line x1="360" y1="370" x2="360" y2="400" stroke="#5a6675" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="402" width="600" height="58" rx="10" fill="#eef2f7" stroke="#b9c6d6"/>
<text x="360" y="424" text-anchor="middle" font-weight="bold">Model switchboard</text>
<text x="360" y="444" text-anchor="middle">Claude · OpenAI (via OpenRouter) · Grok · Gemini · local models (Ollama). "Private" forces local.</text>
<rect x="20" y="478" width="680" height="72" rx="10" fill="#fff6e8" stroke="#d08a1c"/>
<text x="360" y="499" text-anchor="middle" font-weight="bold">Guardrails, each one learned from a real miss</text>
<text x="360" y="518" text-anchor="middle">Outside content is data, never instructions · customer replies are drafts only · confirm before code or deploy</text>
<text x="360" y="537" text-anchor="middle">Family media is screened on the home PC before any cloud · evidence only, no guessing · no secrets in notes</text>
</svg>
<div class="f">Hands do the work, memory keeps the context, the team checks the work, and the guardrails decide what it's allowed to touch.</div>
</body></html>
